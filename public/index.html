<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=http://localhost:3000" />
    <title>Sanchari Basecamp — Redirecting…</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Georgia', serif;
        background: #FBF8F2;
        color: #2D2A25;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 2rem;
      }
      .card {
        background: #fff;
        border: 1px solid #CDD8C6;
        border-radius: 16px;
        padding: 3rem 2.5rem;
        max-width: 420px;
        box-shadow: 0 4px 24px rgba(45,42,37,0.08);
      }
      .ornament { color: #8FA481; font-size: 1.5rem; margin-bottom: 1.25rem; }
      h1 { font-size: 1.75rem; font-style: italic; margin-bottom: 0.5rem; }
      p  { font-size: 0.9rem; color: #72727a; margin-bottom: 1.75rem; line-height: 1.6; }
      a  {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #455538;
        color: #fff;
        text-decoration: none;
        padding: 0.75rem 1.75rem;
        border-radius: 999px;
        font-family: system-ui, sans-serif;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: background 0.2s;
      }
      a:hover { background: #5A6E4A; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="ornament">✦</div>
      <h1>Sanchari Basecamp</h1>
      <p>Your café website is live on the local dev server.<br/>Click below to open it.</p>
      <a href="http://localhost:3000">
        Open Website →
      </a>
    </div>
  </body>
</html>
